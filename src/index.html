<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Frag Supply Co. | Counter-Strike Inspired Merch</title>
    <meta name="description" content="Tees, hoodies, caps, desk mats and stickers for CS players. Built for the grind, made for the clutch.">
    <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/gh/ekmas/cs16.css@main/css/cs16.min.css">
    <link rel="stylesheet" type="text/css" href="styles.css">
    <link rel="preload" href="images/background.png" as="image" fetchpriority="high">
    <link rel="preload" href="sounds/menu_click.wav" as="audio" type="audio/wav">
    <link rel="preload" href="sounds/window_close.wav" as="audio" type="audio/wav">
</head>
<body>
    <div class="container">
        <div class="menu">
            <div class="store-logo">
                <span class="store-name" data-store-name></span>
                <span class="store-tagline" data-store-tagline></span>
            </div>
            <nav class="menu-items" id="menu-items"></nav>
        </div>
    </div>

    <p class="site-footer" id="site-footer"></p>

    <!-- WELCOME -->
    <dialog class="cs-dialog welcome-dialog" id="welcome-dialog">
        <form method="dialog">
            <div class="heading">
                <div class="wrapper">
                    <div class="icon"></div>
                    <p class="text" id="welcome-title">Welcome</p>
                </div>
                <button class="cs-btn close" type="button"></button>
            </div>
            <div class="content">
                <div class="cs-tabs">
                    <input class="radiotab" name="welcome-tabs" type="radio" id="welcome-tab" checked />
                    <label class="label" for="welcome-tab">Server</label>
                    <div class="panel">
                        <div class="map-selector" id="welcome-map-row">
                            <label>Map</label>
                            <select class="cs-select">
                                <option selected id="welcome-map"></option>
                            </select>
                        </div>
                        <hr class="cs-hr" />
                        <div class="description" id="welcome-body"></div>
                    </div>
                </div>
            </div>
            <menu class="footer-btns">
                <button type="button" class="cs-btn" id="welcome-start">Start</button>
                <button type="button" class="cs-btn" id="welcome-cancel">Cancel</button>
            </menu>
        </form>
    </dialog>

    <!-- BUY MENU -->
    <dialog class="cs-dialog buy-dialog" id="buy-dialog">
        <form method="dialog">
            <div class="heading">
                <div class="wrapper">
                    <div class="icon"></div>
                    <p class="text">Buy Menu</p>
                </div>
                <button class="cs-btn close" type="button"></button>
            </div>
            <div class="content">
                <div class="buy-panel">
                        <div class="buy-layout">
                            <div class="buy-left">
                                <div class="category-row">
                                    <label for="category-filter">Category</label>
                                    <select id="category-filter" class="cs-select"></select>
                                </div>
                                <div class="product-browser">
                                    <div class="product-list-header">
                                        <div class="col-name cs-btn">Item</div>
                                        <div class="col-price cs-btn">Price</div>
                                    </div>
                                    <div class="product-list" id="product-list"></div>
                                </div>
                            </div>
                            <div class="buy-right">
                                <div class="product-preview-image" id="preview-image" role="button" tabindex="0" title="Click to enlarge" aria-label="Enlarge photo"></div>
                                <p class="preview-name" id="preview-name">Select an item</p>
                                <p class="preview-price" id="preview-price"></p>
                                <p class="preview-desc" id="preview-desc">Pick something from the list to see details.</p>
                                <a class="preview-link" id="preview-link" href="#" hidden>View full product page &raquo;</a>
                                <div class="preview-options">
                                    <div class="option-row" id="size-row">
                                        <label for="size-select">Size</label>
                                        <select id="size-select" class="cs-select"></select>
                                    </div>
                                    <div class="option-row">
                                        <label for="qty-input">Qty</label>
                                        <input type="number" id="qty-input" class="cs-input qty-input" min="1" max="20" value="1">
                                    </div>
                                </div>
                            </div>
                        </div>
                        <div class="dialog-actions">
                            <span class="action-msg" id="buy-msg"></span>
                            <button type="button" class="cs-btn" id="view-cart-btn">Cart (0)</button>
                            <button type="button" class="cs-btn" id="add-to-cart-btn" disabled>Buy</button>
                        </div>
                </div>
            </div>
        </form>
    </dialog>

    <!-- CART -->
    <dialog class="cs-dialog cart-dialog" id="cart-dialog">
        <form method="dialog">
            <div class="heading">
                <div class="wrapper">
                    <div class="icon"></div>
                    <p class="text">Cart</p>
                </div>
                <button class="cs-btn close" type="button"></button>
            </div>
            <div class="content">
                <div class="cs-tabs">
                    <input class="radiotab" name="cart-tabs" type="radio" id="cart-tab" checked />
                    <label class="label" for="cart-tab">Loadout</label>
                    <div class="panel">
                        <div class="cart-browser">
                            <div class="cart-list-header">
                                <div class="col-name cs-btn">Item</div>
                                <div class="col-size cs-btn">Size</div>
                                <div class="col-qty cs-btn">Qty</div>
                                <div class="col-price cs-btn">Total</div>
                                <div class="col-remove cs-btn">&nbsp;</div>
                            </div>
                            <div class="cart-list" id="cart-list"></div>
                        </div>
                        <div class="cart-bottom">
                            <div class="promo-section">
                                <label for="promo-input">Promo code</label>
                                <div class="promo-row">
                                    <input type="text" id="promo-input" class="cs-input" placeholder="HEADSHOT10" autocomplete="off">
                                    <button type="button" class="cs-btn" id="promo-apply">Apply</button>
                                </div>
                                <p class="promo-msg" id="promo-msg"></p>
                            </div>
                            <div class="totals">
                                <div class="total-row"><span>Subtotal</span><span id="subtotal">$0.00</span></div>
                                <div class="total-row" id="discount-row" hidden><span id="discount-label">Discount</span><span id="discount-amount">-$0.00</span></div>
                                <div class="total-row"><span>Shipping</span><span id="shipping">$0.00</span></div>
                                <div class="total-row grand"><span>Total</span><span id="grand-total">$0.00</span></div>
                                <div class="cs-progress-bar ship-bar"><div class="bars" id="ship-bar"></div></div>
                                <p class="ship-note" id="ship-note"></p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <menu class="footer-btns">
                <button type="button" class="cs-btn" id="checkout-btn" disabled>Checkout</button>
                <button type="button" class="cs-btn" id="cart-keep-shopping">Shop more</button>
                <button type="button" class="cs-btn" id="cart-clear">Clear</button>
            </menu>
        </form>
    </dialog>

    <!-- STORE INFO -->
    <dialog class="cs-dialog info-dialog" id="info-dialog">
        <form method="dialog">
            <div class="heading">
                <div class="wrapper">
                    <div class="icon"></div>
                    <p class="text" id="info-title">Store Info</p>
                </div>
                <button class="cs-btn close" type="button"></button>
            </div>
            <div class="content">
                <div class="cs-tabs" id="info-tabs"></div>
            </div>
            <menu class="footer-btns">
                <button type="button" class="cs-btn" id="info-ok">OK</button>
            </menu>
        </form>
    </dialog>

    <!-- ALERT (checkout not set up, etc.) -->
    <dialog class="cs-dialog alert-dialog" id="alert-dialog">
        <form method="dialog">
            <div class="heading">
                <div class="wrapper">
                    <div class="icon"></div>
                    <p class="text" id="alert-title">Notice</p>
                </div>
            </div>
            <div class="content" id="alert-body"></div>
            <menu class="footer-btns">
                <button class="cs-btn" id="alert-ok">OK</button>
            </menu>
        </form>
    </dialog>

    <script src="lightbox.js"></script>
    <script src="tracking.js"></script>
    <script src="script.js"></script>
</body>
</html>
