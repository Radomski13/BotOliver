[build]
  publish = "src"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

# Keep the admin page out of search engines and never cache it.
[[headers]]
  for = "/admin/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Cache-Control = "no-cache"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "no-cache"
